<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="25" y="35" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Repos per Language</text>

  <!-- Items -->
  <g transform="translate(25, 60)">
    <circle cx="10" cy="10" r="6" fill="#f1e05a"/>
    <text x="25" y="14" fill="#c9d1d9" font-family="sans-serif" font-size="13">JavaScript (40%)</text>
    <rect x="160" y="6" width="180" height="10" rx="5" fill="#21262d"/>
    <rect x="160" y="6" width="72" height="10" rx="5" fill="#f1e05a"/>

    <circle cx="10" cy="40" r="6" fill="#3178c6"/>
    <text x="25" y="44" fill="#c9d1d9" font-family="sans-serif" font-size="13">TypeScript (20%)</text>
    <rect x="160" y="36" width="180" height="10" rx="5" fill="#21262d"/>
    <rect x="160" y="36" width="36" height="10" rx="5" fill="#3178c6"/>

    <circle cx="10" cy="70" r="6" fill="#e34c26"/>
    <text x="25" y="74" fill="#c9d1d9" font-family="sans-serif" font-size="13">HTML / CSS (20%)</text>
    <rect x="160" y="66" width="180" height="10" rx="5" fill="#21262d"/>
    <rect x="160" y="66" width="36" height="10" rx="5" fill="#e34c26"/>

    <circle cx="10" cy="100" r="6" fill="#F80000"/>
    <text x="25" y="104" fill="#c9d1d9" font-family="sans-serif" font-size="13">Swift / Dart (20%)</text>
    <rect x="160" y="96" width="180" height="10" rx="5" fill="#21262d"/>
    <rect x="160" y="96" width="36" height="10" rx="5" fill="#F80000"/>
