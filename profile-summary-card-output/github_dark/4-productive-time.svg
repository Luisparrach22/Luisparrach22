    <rect x="55" y="30" width="25" height="50" rx="2" fill="#1f6feb"/>
    <text x="67" y="95" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">06-12</text>

    <rect x="100" y="10" width="25" height="70" rx="2" fill="#58a6ff"/>
    <text x="112" y="95" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">12-18</text>

    <rect x="145" y="20" width="25" height="60" rx="2" fill="#3fb950"/>
    <text x="157" y="95" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">18-24</text>
