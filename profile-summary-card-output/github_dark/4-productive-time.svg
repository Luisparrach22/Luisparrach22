<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="25" y="35" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Productive Time</text>
  <text x="25" y="55" fill="#8b949e" font-family="sans-serif" font-size="12">Commit activity distribution (UTC+2)</text>

  <!-- Time Histogram Bars -->
  <g transform="translate(25, 85)">
    <rect x="10" y="60" width="25" height="20" rx="2" fill="#161b22"/>
